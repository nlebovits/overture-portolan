# Deploys catalog/ to GitHub Pages.
#
# Pages can only serve / or /docs when it deploys from a branch, and the
# published catalog is catalog/. This workflow uploads that directory as the
# Pages artifact instead, which also keeps the deployed state equal to the
# repository state: a file that leaves catalog/ leaves the site.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: catalog
      - id: deployment
        uses: actions/deploy-pages@v4

  # The live pass needs a deployed URL, so it cannot run on a pull request.
  # Without it, PTL-LIV-004 and PTL-LIV-005 stay unchecked: tests/
  # test_conformance.py runs rashid with no --live, and those two ids are the
  # whole content of its ACCEPTED set. This job asserts that the host still
  # reports exactly those two and nothing else.
  live:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The alpha carries the --url flag that the gate needs. rashid skips the
      # upstream hosts under PORTO-CORE-073 only when it knows the publish
      # host, and without the flag the Overture buckets report CORS failures
      # this catalog does not control.
      # rashid, not portolan-cli. The flags this gate needs reached
      # portolan-cli in 1.0.0a0, a pre-release, and a plain install in CI takes
      # 0.7.0 and fails with "No such option '--no-data'". requirements-ci.txt
      # already pins rashid, so one validator runs every gate.
      - name: Install the validator
        run: python -m pip install -r requirements-ci.txt
      - name: Live hosting gate
        run: |
          python3 tests/test_live_hosting.py \
            "${{ needs.deploy.outputs.page_url }}"
