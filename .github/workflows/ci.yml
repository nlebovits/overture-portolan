name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The pins and the reason for each one are in requirements-ci.txt.
      # sync.yml and data-pass.yml read the same file, so one validator runs
      # every gate. tools/check_rashid_release.py watches the rashid pin.
      - name: Install the validators
        run: python -m pip install -r requirements-ci.txt

      - name: Lint the tooling
        run: |
          python -m pip install ruff
          ruff check tools/ tests/
          ruff format --check tools/ tests/

      # CI_LIGHT exempts asset hrefs with a data suffix from the link check.
      # The checkout holds the metadata and not the bytes. Structural links
      # and every non-data asset still resolve. Leave it unset locally.
      - name: Catalog gates
        env:
          CI_LIGHT: "1"
        run: python3 tests/run_all.py
